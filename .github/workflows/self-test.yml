name: self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y >/dev/null && sudo apt-get install -y shellcheck >/dev/null
      - name: Lint all shell scripts
        run: |
          set -e
          mapfile -t files < <(find scripts src -name '*.sh' -print)
          echo "Linting ${#files[@]} files"
          shellcheck -x --severity=warning "${files[@]}"

  validate-action-yml:
    name: Validate action.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and validate action.yml
        run: |
          python3 -c "
          import yaml, sys
          with open('action.yml') as f:
              a = yaml.safe_load(f)
          assert a.get('runs', {}).get('using', '').startswith('composite'), 'runs.using must be composite'
          assert isinstance(a.get('runs', {}).get('steps'), list), 'runs.steps must be a list'
          assert len(a['runs']['steps']) >= 3, 'expected at least 3 steps'
          inputs = a.get('inputs', {})
          for required in ['primary-provider', 'primary-model', 'github-token']:
              assert inputs.get(required, {}).get('required') == True, f'{required} must be required'
          outputs = a.get('outputs', {})
          for expected in ['success', 'pr-number', 'pr-url', 'branch-name', 'cost']:
              assert expected in outputs, f'missing output: {expected}'
          print(f'OK: {len(inputs)} inputs, {len(outputs)} outputs, {len(a[\"runs\"][\"steps\"])} steps')
          "

  bash-syntax:
    name: Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on all scripts
        run: |
          set -e
          find scripts src -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            bash -n "$f" || exit 1
          done
          echo "All scripts parse cleanly"
